appId: dev.flowy.companion
productName: Flowy
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/models
    to: models
    filter: ["**/*"]
  # Persistent PowerShell host script (sent user scripts over stdin; avoids -EncodedCommand AV heuristics)
  - from: resources/ps
    to: ps
    filter: ["**/*"]
  # Tray icons are read from process.resourcesPath at runtime (src/main/index.ts trayIconPath)
  - from: resources
    to: .
    filter: ["tray.ico", "tray.png", "icon.png"]
# Do not try to rebuild native modules (there are none; avoids node-gyp on CI)
npmRebuild: false
asar: true
win:
  target:
    - nsis
    - portable
    - zip
  icon: resources/icon.ico
  # 'asInvoker' = normal user rights. The app offers an in-app "Restart as administrator"
  # action for full root access; set this to 'requireAdministrator' to always elevate.
  requestedExecutionLevel: asInvoker
portable:
  artifactName: Flowy-Portable-${version}.exe
nsis:
  artifactName: Flowy-Setup-${version}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Flowy
