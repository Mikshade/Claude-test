<?xml version="1.0" encoding="UTF-8"?>
<!-- Flowy app icon: a flat, cute anime-girl bust on a purple→pink rounded square.
     Designed to stay readable at 16 px (dark hair + cream face + closed happy eyes).
     Rasterised once with ffmpeg/librsvg + ImageMagick (see README "Development"). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2f63"/>
      <stop offset="1" stop-color="#271e42"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- bust / collar -->
  <path d="M140 512 C140 428 196 392 256 392 C316 392 372 428 372 512 Z" fill="#fff6ec"/>

  <!-- hair (back) with two strands falling over the shoulders -->
  <path d="M106 258 C106 142 176 86 256 86 C336 86 406 142 406 258
           L406 424 C406 440 394 452 378 452 L352 452 C340 452 332 444 332 432
           L332 322 L180 322 L180 432 C180 444 172 452 160 452 L134 452
           C118 452 106 440 106 424 Z" fill="url(#hair)"/>

  <!-- face -->
  <circle cx="256" cy="268" r="112" fill="#fff6ec"/>

  <!-- bangs (M-shaped fringe with a centre peak) -->
  <path d="M134 270 C134 150 192 104 256 104 C320 104 378 150 378 270
           C354 232 322 210 286 218 C270 222 262 238 256 254
           C250 238 242 222 226 218 C190 210 158 232 134 270 Z" fill="url(#hair)"/>

  <!-- hair highlight -->
  <path d="M178 170 C198 140 226 124 254 122" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="16" stroke-linecap="round"/>

  <!-- ribbon accent -->
  <circle cx="352" cy="176" r="17" fill="#f9a8d4"/>
  <circle cx="388" cy="164" r="17" fill="#f9a8d4"/>
  <circle cx="370" cy="172" r="10" fill="#ffd6ea"/>

  <!-- closed happy eyes  ^ ^ -->
  <path d="M194 296 Q214 270 234 296" fill="none" stroke="#3d2f63" stroke-width="13" stroke-linecap="round"/>
  <path d="M278 296 Q298 270 318 296" fill="none" stroke="#3d2f63" stroke-width="13" stroke-linecap="round"/>

  <!-- blush -->
  <circle cx="186" cy="322" r="15" fill="#f9a8d4" fill-opacity="0.75"/>
  <circle cx="326" cy="322" r="15" fill="#f9a8d4" fill-opacity="0.75"/>

  <!-- smile -->
  <path d="M238 336 Q256 352 274 336" fill="none" stroke="#e0679a" stroke-width="9" stroke-linecap="round"/>
</svg>
