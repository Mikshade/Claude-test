<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cubism Core must be a classic global script loaded BEFORE the module bundle. The CDN fallback
         is used only when `npm run setup:live2d` has not placed the file under public/vendor. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' flowy-model:; script-src 'self' https://cubism.live2d.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: flowy-model:; media-src 'self' blob: data:; connect-src 'self' flowy-model: blob: data:; font-src 'self' data:"
    />
    <title>Flowy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="overlay">
    <script src="../vendor/live2dcubismcore.min.js"></script>
    <div id="stage"></div>
    <!-- The speech bubble is the only interactive DOM: chat input, confirm prompt and subtitles live inside it
         (bubble.ts builds the inner structure). -->
    <div id="bubble" class="bubble" data-visible="false" aria-live="polite"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
