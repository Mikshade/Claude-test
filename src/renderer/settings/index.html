<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src https: for voice cover images, media-src https: blob: for voice samples / test playback.
         connect-src stays local: all network calls go through the main process over IPC. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' blob: data:; font-src 'self' data:"
    />
    <title>Flowy – Einstellungen</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
